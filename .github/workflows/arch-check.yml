name: Arch check

# Cheap cross-architecture check for code that differs per platform. The main
# CMake build only runs on x86-64, so the AArch64 paths would otherwise never be
# compiled -- and PiPedal still has to build for the Raspberry Pi.

on:
  push:
    branches: [ main, dev, 'perf/**' ]
    paths:
      - 'src/DenormalProtection.hpp'
      - '.github/workflows/arch-check.yml'
  workflow_dispatch:

jobs:
  headers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu

      - name: Compile DenormalProtection.hpp for x86-64
        run: g++ -std=c++20 -Wall -Wextra -fsyntax-only -x c++ src/DenormalProtection.hpp

      - name: Compile DenormalProtection.hpp for AArch64 (Raspberry Pi)
        run: aarch64-linux-gnu-g++ -std=c++20 -Wall -Wextra -fsyntax-only -x c++ src/DenormalProtection.hpp
